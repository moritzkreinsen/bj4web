<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BJ4Web</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>BJ4Web</strong><select id="lang" aria-label="Language / Sprache"><option value="en">English</option><option value="de">Deutsch</option></select></header>
<main><section id="start"><h1 data-t="workspace"></h1><p data-t="security"></p><label><span data-t="password"></span><input type="password" id="password"></label><button id="create" data-t="create"></button> <button id="example" data-t="example"></button><hr><label><span data-t="link"></span><input id="link"></label><button id="open" data-t="open"></button></section>
<section hidden id="ide"><nav><details><summary data-t="project"></summary><div><button id="share" data-t="share"></button><button id="export" data-t="export"></button><label><span data-t="importZip"></span><input type="file" accept=".zip" id="zip"></label><button id="changePassword" data-t="changePassword"></button><button id="erase" data-t="erase"></button></div></details>
<details><summary data-t="edit"></summary><div><button id="editClass" data-t="editor"></button><button id="rename" data-t="rename"></button><button id="removeFile" data-t="removeFile"></button></div></details>
<details><summary data-t="view"></summary><div><button id="terminal" data-t="console"></button><label><input id="uses" type="checkbox" checked><span data-t="uses"></span></label></div></details></nav>
<div class="project"><aside><button id="add" data-t="add"></button><button id="inherit" data-t-title="inherit"><svg width="36" height="18" viewBox="0 0 36 18" aria-hidden="true"><path d="M2 9H23 M23 3L33 9L23 15Z" fill="none" stroke="currentColor"/></svg></button><button id="compile" data-t="compile"></button><button id="rerun" data-t="rerun" disabled></button></aside>
<section class="viewport" data-t-label="classes"><div id="sheet"><svg id="arrows" aria-hidden="true"><defs><marker id="triangle" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M1 1L15 7L1 13Z" fill="#f9f7f2" stroke="#242424"/></marker><marker id="tip" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#333"/></marker></defs><g id="edges"></g></svg><div id="classes"></div><p id="empty" data-t="empty"></p></div></section></div>
<div id="bench" data-t-label="bench"></div>
<section id="editorPanel" class="panel" hidden><div class="bar"><label for="source" id="file"></label><button data-hide="editorPanel" data-t-title="close">×</button></div><textarea spellcheck="false" id="source"></textarea><button id="save" data-t="save"></button></section>
<section id="inspectPanel" class="panel" hidden><div class="bar"><strong id="inspectTitle"></strong><button data-hide="inspectPanel" data-t-title="close">×</button></div><pre id="fields"></pre><select id="members"></select><label><span data-t="args"></span><textarea rows="2" id="args"></textarea></label><label><span data-t="resultName"></span><input id="name"></label><button id="invoke" data-t="invoke"></button></section>
<section id="consolePanel" class="panel" hidden><div class="bar"><strong data-t="console"></strong><button data-hide="consolePanel" data-t-title="close">×</button></div><pre id="console" role="log"></pre></section>
<section id="window" class="panel" hidden></section><div id="context" hidden></div></section><p id="status" role="status"></p></main><footer data-t="credit"></footer><script src="/app.js"></script></body></html>
