<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BJ4Web</title><link rel="stylesheet" href="/style.css">
<header><strong>BJ4Web</strong><select id="lang" aria-label="Language / Sprache"><option value="en">English</option><option value="de">Deutsch</option></select></header>
<main><section id="start"><h1 data-t="workspace"></h1><p data-t="security"></p><label><span data-t="password"></span><input type="password" id="password"></label><button id="create" data-t="create"></button><hr><label><span data-t="link"></span><input id="link"></label><button id="open" data-t="open"></button></section>
<section hidden id="ide"><div class="tools"><button id="add" data-t="add"></button><button id="save" data-t="save"></button><button id="compile" data-t="compile"></button><button id="export" data-t="export"></button><button id="rename" data-t="rename"></button><button id="removeFile" data-t="removeFile"></button><label><span data-t="importZip"></span><input type="file" accept=".zip" id="zip"></label><button id="changePassword" data-t="changePassword"></button><button id="erase" data-t="erase"></button><button id="share" data-t="share"></button></div>
<div class="grid"><aside><h2 data-t="classes"></h2><div id="classes"></div><pre id="relations"></pre></aside><article><label for="source" id="file"></label><textarea spellcheck="false" id="source"></textarea></article></div>
<div class="grid"><aside><h2 data-t="bench"></h2><div id="bench"></div></aside><article><h2 data-t="inspect"></h2><pre id="fields"></pre><select id="members"></select><label><span data-t="args"></span><textarea rows="2" id="args"></textarea></label><label><span data-t="resultName"></span><input id="name"></label><button id="invoke" data-t="invoke"></button></article></div>
<section id="window" hidden></section><h2 data-t="console"></h2><pre id="console" role="log"></pre></section><p id="status" role="status"></p></main><footer data-t="credit"></footer><script src="/app.js"></script></html>
